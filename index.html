
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Compliance & Expiry Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    .badge-expired { background-color: #dc3545; color: #fff; }
    .badge-urgent { background-color: #ffc107; color: #000; }
    .badge-valid { background-color: #198754; color: #fff; }
    .table-responsive { max-height: 70vh; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm px-3">
    <span class="navbar-brand fw-bold mb-0">
      <i class="bi bi-truck me-2"></i>Vehicle Compliance Dashboard
    </span>
    <button class="btn btn-outline-light btn-sm" onclick="fetchVehicles()">
      <i class="bi bi-arrow-clockwise me-1"></i>Refresh
    </button>
  </nav>

  <div class="container-fluid py-4 px-4">
    <!-- Summary Metric Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card border-0 shadow-sm border-start border-primary border-4 p-3">
          <div class="text-muted small">Total Vehicles</div>
          <div class="h3 fw-bold mb-0" id="totalCount">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm border-start border-danger border-4 p-3">
          <div class="text-muted small">Expired Documents</div>
          <div class="h3 fw-bold text-danger mb-0" id="expiredCount">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm border-start border-warning border-4 p-3">
          <div class="text-muted small">Due in 30 Days</div>
          <div class="h3 fw-bold text-warning mb-0" id="urgentCount">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm border-start border-success border-4 p-3">
          <div class="text-muted small">All Clear / Active</div>
          <div class="h3 fw-bold text-success mb-0" id="validCount">0</div>
        </div>
      </div>
    </div>

    <!-- Controls: Search & Filter -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-8">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by Reg No, Owner, or Mobile..." oninput="filterData()" />
          </div>
          <div class="col-md-4">
            <select id="statusFilter" class="form-select" onchange="filterData()">
              <option value="ALL">Show All Statuses</option>
              <option value="EXPIRED">Action Required (Expired)</option>
              <option value="URGENT">Attention (Due within 30 Days)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Vehicles Table -->
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark small">
            <tr>
              <th>Reg. Number</th>
              <th>Owner / Customer</th>
              <th>Mobile</th>
              <th>Category</th>
              <th>Insurance</th>
              <th>FC Expiry</th>
              <th>PUC Expiry</th>
              <th>Road Tax Due</th>
              <th>Permit</th>
              <th>Overall Status</th>
            </tr>
          </thead>
          <tbody id="vehicleRows" class="small">
            <tr><td colspan="10" class="text-center py-4 text-muted">Connecting to API...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // REPLACE WITH YOUR CLOUDFLARE WORKER ENDPOINT
    const API_URL = "https://vehicle-api.dhiwakardiva111.workers.dev/api/vehicles";
    let allVehicles = [];

    function getDaysDiff(dateString) {
      if (!dateString) return null;
      const target = new Date(dateString);
      const now = new Date();
      const diffMs = target - now;
      return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    }

    function createDateBadge(dateString) {
      if (!dateString) return '<span class="text-muted">-</span>';
      const days = getDaysDiff(dateString);
      if (days < 0) {
        return `<span class="badge badge-expired" title="${days} days ago">${dateString}</span>`;
      } else if (days <= 30) {
        return `<span class="badge badge-urgent" title="Due in ${days} days">${dateString} (${days}d)</span>`;
      }
      return `<span class="text-dark">${dateString}</span>`;
    }

    function calculateOverallStatus(v) {
      const keys = [v.insurance_expiry, v.fc_expiry, v.puc_expiry, v.road_tax_due, v.permit_expiry];
      let hasExpired = false;
      let hasUrgent = false;

      for (const d of keys) {
        const diff = getDaysDiff(d);
        if (diff !== null) {
          if (diff < 0) hasExpired = true;
          else if (diff <= 30) hasUrgent = true;
        }
      }

      if (hasExpired) return "EXPIRED";
      if (hasUrgent) return "URGENT";
      return "VALID";
    }

    async function fetchVehicles() {
      const tbody = document.getElementById("vehicleRows");
      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">Loading records...</td></tr>';
      try {
        const res = await fetch(API_URL);
        allVehicles = await res.json();
        renderStats();
        filterData();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center text-danger py-4">API Error: ${err.message}</td></tr>`;
      }
    }

    function renderStats() {
      let expired = 0;
      let urgent = 0;
      let valid = 0;

      allVehicles.forEach(v => {
        const st = calculateOverallStatus(v);
        if (st === "EXPIRED") expired++;
        else if (st === "URGENT") urgent++;
        else valid++;
      });

      document.getElementById("totalCount").innerText = allVehicles.length;
      document.getElementById("expiredCount").innerText = expired;
      document.getElementById("urgentCount").innerText = urgent;
      document.getElementById("validCount").innerText = valid;
    }

    function filterData() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filter = document.getElementById("statusFilter").value;
      const tbody = document.getElementById("vehicleRows");

      const filtered = allVehicles.filter(v => {
        const status = calculateOverallStatus(v);
        const matchesSearch = 
          (v.registration_no && v.registration_no.toLowerCase().includes(query)) ||
          (v.owner_name && v.owner_name.toLowerCase().includes(query)) ||
          (v.customer_mobile && v.customer_mobile.includes(query));

        const matchesStatus = (filter === "ALL") || (status === filter);
        return matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">No matching vehicles found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(v => {
        const status = calculateOverallStatus(v);
        let statusBadge = '<span class="badge badge-valid">All Valid</span>';
        if (status === "EXPIRED") statusBadge = '<span class="badge badge-expired">Expired Items</span>';
        if (status === "URGENT") statusBadge = '<span class="badge badge-urgent">Action Due</span>';

        return `
          <tr>
            <td class="fw-bold text-primary">${v.registration_no}</td>
            <td>
              <div>${v.owner_name}</div>
              <div class="text-muted" style="font-size: 0.75rem;">${v.customer_name || ''}</div>
            </td>
            <td>${v.customer_mobile || '-'}</td>
            <td><span class="badge bg-secondary">${v.vehicle_category || 'N/A'}</span></td>
            <td>${createDateBadge(v.insurance_expiry)}</td>
            <td>${createDateBadge(v.fc_expiry)}</td>
            <td>${createDateBadge(v.puc_expiry)}</td>
            <td>${createDateBadge(v.road_tax_due)}</td>
            <td>${createDateBadge(v.permit_expiry)}</td>
            <td>${statusBadge}</td>
          </tr>
        `;
      }).join('');
    }

    fetchVehicles();
  </script>
</body>
</html>
