<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Vehicle Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card border-0 shadow-lg p-4" style="max-width: 380px; width: 100%;">
    <div class="text-center mb-4">
      <div class="display-6 text-primary mb-2"><i class="bi bi-truck-front-fill"></i></div>
      <h4 class="fw-bold">Fleet Management</h4>
      <p class="text-muted small">Sign in to your compliance workspace</p>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required autofocus />
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
      </div>
      <div id="loginError" class="alert alert-danger py-2 small d-none">Invalid credentials!</div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
