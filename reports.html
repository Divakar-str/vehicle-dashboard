<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/auth.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Reports</title>
  
  <link rel="icon" type="image/png" href="images/favicon.ico" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/reports.css" />
</head>
<body class="glass-app-bg">
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1400;">
    <div id="liveToast" class="toast align-items-center text-white border-0 shadow-lg" role="alert">
      <div class="d-flex">
        <div class="toast-body py-2 px-3 fw-bold" id="toastMessage">Action completed.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

   <!-- Standard Bootstrap Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top glass-navbar">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
        <img src="images/logo.png" alt="Logo" width="32" height="32" class="rounded-circle bg-white p-1 shadow-sm" onerror="this.style.display='none'" />
        <span class="fw-bold tracking-tight">Fleet Management</span>
      </a>
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="topNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
          <li class="nav-item"><a class="nav-link px-3 rounded-pill" href="dashboard.html"><i class="fa fa-th-large me-1"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link px-3 rounded-pill" href="customers.html"><i class="fa fa-users me-1"></i> Customers</a></li>
          <li class="nav-item"><a class="nav-link px-3 rounded-pill" href="vehicles.html"><i class="fa fa-truck me-1"></i> Vehicles</a></li>
          <li class="nav-item"><a class="nav-link active px-3 rounded-pill bg-primary bg-opacity-25 text-white" href="reports.html"><i class="fa fa-chart-bar me-1"></i> Reports</a></li>
          <li class="nav-item"><a class="nav-link px-3 rounded-pill" href="print.html"><i class="fa fa-print me-1"></i> Print</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <span class="text-white-50 small"><i class="fa fa-user-circle me-1"></i><span id="userDisplay" class="text-white fw-semibold">admin</span></span>
          <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="Auth.logout()"><i class="fa fa-sign-out-alt me-1"></i>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="report-container">
    <!-- Clean Print-Only Header: Displays ONLY "Generated on: DD/MM/YYYY" -->
    <div class="print-a4-header">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <span>Generated on: <span id="printDateStamp"></span></span>
        </div>
        <div>
          <span class="font-mono text-muted" id="printFilterLabel"></span>
        </div>
      </div>
    </div>

    <!-- Operations Console -->
    <div class="erp-card d-print-none mb-2">
      <div class="erp-card-header">
        <div class="d-flex align-items-center gap-2">
          <i class="fa fa-shield-halved text-primary"></i>
          <span class="fw-bold text-dark" style="font-size: 0.88rem;">Vehicle Compliance Register</span>
          <span class="badge bg-secondary-subtle text-secondary border font-mono py-1" id="reportCountBadge">0 Vehicles</span>
        </div>
        <div class="d-flex align-items-center gap-1.5">
          <button class="btn btn-outline-success btn-sm py-1 px-2.5 fw-bold" onclick="ReportController.exportCSV()">
            <i class="fa fa-file-excel me-1"></i>Export Excel
          </button>
          <button class="btn btn-dark btn-sm py-1 px-2.5 fw-bold" onclick="ReportController.printReport()">
            <i class="fa fa-print me-1"></i>Print A4
          </button>
          <button class="btn btn-outline-secondary btn-sm py-1 px-2" onclick="ReportController.load()" title="Reload Data">
            <i id="refreshIcon" class="fa fa-sync-alt text-primary"></i>
          </button>
        </div>
      </div>

      <div class="erp-card-body">
        <div class="row g-2 align-items-end mb-2">
          <div class="col-md-3">
            <label class="label-xs">Customer / Firm</label>
            <select id="reportCustomerSelect"></select>
          </div>
          <div class="col-md-3">
            <label class="label-xs">Expiry Window</label>
            <div class="input-group input-group-sm">
              <input type="date" id="dateFilterFrom" class="form-control form-control-xs" onchange="ReportController.applyFilters()" />
              <input type="date" id="dateFilterTo" class="form-control form-control-xs" onchange="ReportController.applyFilters()" />
              <button class="btn btn-outline-secondary px-2" onclick="ReportController.resetDates()"><i class="fa fa-times"></i></button>
            </div>
          </div>
          <div class="col-md-2">
            <label class="label-xs">Permit Rule</label>
            <select id="reportPermitFilter" class="form-select form-select-xs" onchange="ReportController.applyFilters()">
              <option value="ALL">All Fleets</option>
              <option value="PERMIT_ONLY">State Permit Only</option>
              <option value="NP_ONLY">National Permit (NP) Only</option>
              <option value="BOTH_PERMIT">Both State &amp; NP</option>
              <option value="NO_PERMIT">No Permit (Exempt)</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="label-xs">Category</label>
            <select id="reportCategoryFilter" class="form-select form-select-xs" onchange="ReportController.applyFilters()">
              <option value="">All Categories</option>
              <option value="HGV">HGV</option>
              <option value="MGV">MGV</option>
              <option value="LGV">LGV</option>
              <option value="LMV">LMV</option>
              <option value="LPV">LPV</option>
              <option value="MPV">MPV</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-1">
            <div class="dropdown flex-fill">
              <button class="btn btn-outline-secondary btn-sm w-100 fw-bold py-1" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                <i class="fa fa-columns me-1"></i>Cols
              </button>
              <div class="dropdown-menu p-2 shadow-lg">
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="fld_age" onchange="ReportController.applyFilters()"><label class="form-check-label small">Vehicle Age</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="fld_engine" onchange="ReportController.applyFilters()"><label class="form-check-label small">Engine No</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="fld_audit" onchange="ReportController.applyFilters()"><label class="form-check-label small">Audit Timestamps</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="fld_rem_days" onchange="ReportController.applyFilters()"><label class="form-check-label small">Days Left Pills</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" id="fld_alt_contacts" onchange="ReportController.applyFilters()"><label class="form-check-label small">Alt Mobiles</label></div>
              </div>
            </div>
            <div class="dropdown flex-fill">
              <button class="btn btn-outline-secondary btn-sm w-100 fw-bold py-1" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                <i class="fa fa-file-lines me-1"></i>Docs
              </button>
              <div class="dropdown-menu p-2 shadow-lg">
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="col_permit" checked onchange="ReportController.applyFilters()"><label class="form-check-label small">State Permit</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="col_np" checked onchange="ReportController.applyFilters()"><label class="form-check-label small">National Permit</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="col_fc" checked onchange="ReportController.applyFilters()"><label class="form-check-label small">Fitness (FC)</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="col_tax" checked onchange="ReportController.applyFilters()"><label class="form-check-label small">Road Tax</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="col_gtax" checked onchange="ReportController.applyFilters()"><label class="form-check-label small">Green Tax</label></div>
                <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="col_ins" checked onchange="ReportController.applyFilters()"><label class="form-check-label small">Insurance</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" id="col_puc" checked onchange="ReportController.applyFilters()"><label class="form-check-label small">Pollution (PUC)</label></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Presets Row (Vibrant Colored Buttons) -->
        <div class="preset-bar pt-2 border-top">
          <span class="label-xs mb-0 me-1">Presets:</span>
          <button type="button" class="chip-btn preset-all active" onclick="ReportController.setQuickPreset('ALL', this)">All</button>
          <button type="button" class="chip-btn preset-overdue" onclick="ReportController.setQuickPreset('OVERDUE', this)">Overdue (&le; 0d)</button>
          <button type="button" class="chip-btn preset-crit" onclick="ReportController.setQuickPreset('CRITICAL_7', this)">Due in 7 Days</button>
          <button type="button" class="chip-btn preset-soon" onclick="ReportController.setQuickPreset('UPCOMING_15', this)">Due in 15 Days</button>
          <button type="button" class="chip-btn preset-warn" onclick="ReportController.setQuickPreset('WINDOW_30', this)">Due in 30 Days</button>
          <button type="button" class="chip-btn preset-notice" onclick="ReportController.setQuickPreset('WINDOW_45', this)">Due in 45 Days</button>
          <button type="button" class="chip-btn preset-window60" onclick="ReportController.setQuickPreset('WINDOW_60', this)">Due in 60 Days</button>
          <button type="button" class="chip-btn preset-missing" onclick="ReportController.setQuickPreset('MISSING_ONLY', this)">Missing Papers</button>
          <button type="button" class="chip-btn preset-blocked" onclick="ReportController.setQuickPreset('BLOCKED_ONLY', this)">Action Required</button>
          <button type="button" class="chip-btn preset-barred" onclick="ReportController.setQuickPreset('AGE_BARRED', this)">15y+ Barred</button>
        </div>
      </div>
    </div>

    <!-- Main Table Container -->
    <div class="erp-card">
      <div class="table-responsive">
        <table class="table align-middle w-100" id="reportDataTable"></table>
      </div>
    </div>
  </main>

  <!-- Combined Date Editor with Diff Display -->
  <div class="modal fade" id="quickDateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-dark text-white py-2 px-3">
          <h6 class="modal-title fw-bold mb-0">Update Expiry Date</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="event.preventDefault(); ReportController.saveQuickDate();">
          <div class="modal-body p-3">
            <input type="hidden" id="qd_vehicle_id" />
            <input type="hidden" id="qd_field_name" />
            <input type="hidden" id="qd_original_val" />

            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="label-xs mb-0" id="qd_label">Select New Expiry Date</label>
              <button type="button" class="btn btn-link btn-sm p-0 text-danger text-decoration-none fw-bold" onclick="ReportController.clearInput('qd_input');">Clear</button>
            </div>
            <input type="date" id="qd_input" class="form-control form-control-xs fw-bold mb-2" required onchange="ReportController.onDateInputChange()" />

            <!-- Diff Warning Banner -->
            <div id="qd_diff_box" class="p-2.5 bg-light rounded border mb-2 small fw-bold">
              <div class="text-muted">Current Saved: <span class="font-mono text-danger text-decoration-line-through fw-bold" id="qd_diff_old">-</span></div>
              <div>Proposed New: <span class="font-mono text-success fs-6 fw-bold" id="qd_diff_new">-</span></div>
              <div class="text-danger small mt-1"><i class="fa fa-info-circle me-1"></i>Please verify changes before saving.</div>
            </div>

            <!-- Quick Advancement Shortcuts -->
            <div class="p-2 bg-light rounded border">
              <small class="text-secondary d-block fw-bold mb-1">Quick Date Advancement:</small>
              <div class="d-flex flex-wrap gap-1" id="qd_advance_shortcuts"></div>
            </div>
          </div>
          <div class="modal-footer bg-light py-2 px-3">
            <button type="button" class="btn btn-secondary btn-sm fw-bold rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="btnSaveQuickDate" class="btn btn-primary btn-sm fw-bold rounded-pill px-3">Confirm &amp; Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Quick Remarks Editor Modal -->
  <div class="modal fade" id="quickRemarksModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-dark text-white py-2 px-3">
          <h6 class="modal-title fw-bold mb-0">Edit Remarks</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="event.preventDefault(); ReportController.saveQuickRemarks();">
          <div class="modal-body p-3">
            <input type="hidden" id="qr_vehicle_id" />
            <textarea id="qr_input" class="form-control fw-bold" rows="3" placeholder="Enter remarks..."></textarea>
          </div>
          <div class="modal-footer bg-light py-2 px-3">
            <button type="button" class="btn btn-secondary btn-sm fw-bold rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="btnSaveQuickRemarks" class="btn btn-primary btn-sm fw-bold rounded-pill px-3">Save Remarks</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  
 
  <script src="js/api.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
